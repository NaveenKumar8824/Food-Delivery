<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E23744" />
  <title>Promila Restaurant – Pay via UPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #E23744;
      --primary-dark: #CB202D;
      --primary-light: #FDECEE;
      --text: #1C1C1C;
      --text-2: #696969;
      --text-3: #9C9C9C;
      --border: #EAEAEA;
      --wa: #1DA851;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: var(--text); }
    body { min-height: 100vh; }
    button { font-family: inherit; }

    .header { border-bottom: 1px solid var(--border); background: #fff; }
    .header-inner { max-width: 480px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .header svg { width: 40px; height: 40px; flex-shrink: 0; }
    .header h1 { font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
    .header span { font-size: 11.5px; color: var(--text-2); font-weight: 500; display: block; }

    .wrap { max-width: 480px; margin: 0 auto; padding: 26px 16px 40px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
    .amount-box { display: flex; align-items: center; border: 1.5px solid #DCDCDC; border-radius: 14px; padding: 0 16px; height: 72px; transition: border-color .15s, box-shadow .15s; }
    .amount-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(226, 55, 68, .12); }
    .amount-box .rupee { font-size: 30px; font-weight: 800; color: var(--text-2); margin-right: 8px; }
    .amount-box input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 34px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
    .amount-box input::placeholder { color: #CFCFCF; }
    .clear-btn { border: none; background: #ECECEC; color: var(--text-2); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; display: none; }

    .error { display: none; margin-top: 12px; background: #FDECEC; border: 1px solid #F5B5B5; color: #A61B1B; font-size: 12.5px; font-weight: 600; padding: 10px 13px; border-radius: 10px; }

    .qr-panel { display: none; text-align: center; margin-top: 28px; animation: pop .25s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pay-amount { font-size: 13px; color: var(--text-2); font-weight: 600; }
    .pay-amount strong { display: block; font-size: 36px; font-weight: 800; color: var(--text); letter-spacing: -.02em; margin-top: 2px; }
    .qr-frame { width: 270px; max-width: 100%; margin: 16px auto 12px; padding: 12px; border: 1px solid var(--border); border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(28, 28, 28, .08); }
    .qr-frame img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .payee { font-size: 14px; font-weight: 800; }
    .upi-id { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-2); margin: 2px 0 20px; word-break: break-all; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { height: 50px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
    .btn.download { background: var(--primary); color: #fff; }
    .btn.download:active { background: var(--primary-dark); }
    .btn.whatsapp { background: #E8F8EE; border-color: #B8E6C8; color: #128C3E; }
    .btn.whatsapp:active { background: #D6F2E1; }
    .generate-btn { width: 100%; height: 52px; margin-top: 14px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
    .generate-btn:active { background: var(--primary-dark); }
    .another-btn { width: 100%; height: 46px; margin-top: 12px; border: 1px solid var(--primary); border-radius: 12px; background: #fff; color: var(--primary); font-size: 13.5px; font-weight: 800; cursor: pointer; }
    .another-btn:active { background: var(--primary-light); }
    .lib-error { display: none; margin-top: 14px; font-size: 12.5px; color: #A61B1B; background: #FDECEC; border: 1px solid #F5B5B5; border-radius: 10px; padding: 10px 13px; text-align: left; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #232325; color: #fff; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#E23744"/><path d="M24 17c-3-3.5-3-6.5 0-10M32 15c-3-3.5-3-7 0-11M40 17c-3-3.5-3-6.5 0-10" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"/><circle cx="32" cy="24" r="3" fill="#fff"/><path d="M13 40c0-9.5 8-15 19-15s19 5.5 19 15z" fill="#fff"/><rect x="11" y="41.5" width="42" height="3.5" rx="1.75" fill="#fff"/><path d="M16 47h32l-3 8.5a3 3 0 0 1-2.8 2H21.8a3 3 0 0 1-2.8-2z" fill="#fff"/></svg>
      <div>
        <h1>Promila Restaurant</h1>
        <span>UPI payment</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <label for="amount">Enter amount</label>
    <div class="amount-box">
      <span class="rupee">₹</span>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" maxlength="9" autofocus />
      <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear amount">&times;</button>
    </div>
    <button type="button" class="generate-btn" id="generateBtn">Generate QR</button>
    <div class="error" id="errorBox"></div>

    <section class="qr-panel" id="qrPanel">
      <div class="pay-amount">Pay Promila Restaurant<strong id="amountDisplay">₹0</strong></div>
      <div class="qr-frame"><img id="qrImg" alt="UPI payment QR code" /></div>
      <div class="payee" id="payeeName"></div>
      <div class="upi-id" id="upiIdText"></div>

      <div class="btn-row">
        <button type="button" class="btn download" id="downloadBtn">Download QR</button>
        <button type="button" class="btn whatsapp" id="shareBtn">Share on WhatsApp</button>
      </div>
      <button type="button" class="another-btn" id="anotherBtn">Collect another payment</button>
      <div class="lib-error" id="libError">The QR could not load. Please check your internet connection and try again.</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    /*************************************************************************
     * SETTINGS (EDIT HERE)
     *************************************************************************/
    const UPI_ID = "q162300613@axl";
    const PAYEE_NAME = "Promila Restaurant";
    const MAX_AMOUNT = 100000; // UPI per-payment limit for most apps

    /*************************************************************************
     * HELPERS
     *************************************************************************/
    const $ = (id) => document.getElementById(id);
    const amountEl = $("amount");
    let currentLink = "";
    let currentAmount = 0;
    let currentQrUrl = "";

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove("show"), 2400);
    }

    function formatINR(n) {
      const hasDecimals = Math.round(n * 100) % 100 !== 0;
      return "₹" + n.toLocaleString("en-IN", {
        minimumFractionDigits: hasDecimals ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    function sanitizeAmount(raw) {
      let v = raw.replace(/[^\d.]/g, "");
      const firstDot = v.indexOf(".");
      if (firstDot !== -1) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, "");
        const [whole, dec] = v.split(".");
        v = whole + "." + dec.slice(0, 2);
      }
      return v.replace(/^0+(?=\d)/, "");
    }

    function buildUpiLink(amount) {
      return "upi://pay?" + [
        `pa=${UPI_ID}`,
        `pn=${encodeURIComponent(PAYEE_NAME)}`,
        `am=${amount.toFixed(2)}`,
        `cu=INR`
      ].join("&");
    }

    /*************************************************************************
     * INSTANT QR
     *************************************************************************/
    function setError(msg) {
      const box = $("errorBox");
      if (msg) { box.textContent = msg; box.style.display = "block"; }
      else { box.style.display = "none"; }
    }

    function hideQr() {
      $("qrPanel").style.display = "none";
      currentLink = "";
      currentQrUrl = "";
    }

    function generate() {
      const value = amountEl.value;
      $("clearBtn").style.display = value ? "inline-block" : "none";
      setError("");

      if (!value || value === ".") { hideQr(); setError("Please enter an amount."); return; }

      const amount = Number(value);
      if (!isFinite(amount) || amount <= 0) {
        hideQr();
        setError("Please enter an amount greater than ₹0.");
        return;
      }
      if (amount > MAX_AMOUNT) {
        hideQr();
        setError("UPI allows up to ₹1,00,000 per payment. Please enter a smaller amount.");
        return;
      }

      currentAmount = amount;
      currentLink = buildUpiLink(amount);

      $("amountDisplay").textContent = formatINR(amount);
      $("payeeName").textContent = PAYEE_NAME;
      $("upiIdText").textContent = UPI_ID;

      let ok = false;
      if (typeof qrcode === "function") {
        try {
          const qr = qrcode(0, "M");
          qr.addData(currentLink);
          qr.make();
          currentQrUrl = qr.createDataURL(8, 4);
          $("qrImg").src = currentQrUrl;
          ok = true;
        } catch (e) {}
      }
      $("qrImg").style.display = ok ? "block" : "none";
      $("libError").style.display = ok ? "none" : "block";
      $("downloadBtn").disabled = !ok;
      $("shareBtn").disabled = !ok;
      $("qrPanel").style.display = "block";
      amountEl.blur();
      setTimeout(() => $("qrPanel").scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    }

    function updateClear() {
      $("clearBtn").style.display = amountEl.value ? "inline-block" : "none";
    }

    function resetForNext() {
      amountEl.value = "";
      updateClear();
      setError("");
      hideQr();
      window.scrollTo({ top: 0, behavior: "smooth" });
      amountEl.focus();
    }

    amountEl.addEventListener("input", () => {
      const clean = sanitizeAmount(amountEl.value);
      if (clean !== amountEl.value) amountEl.value = clean;
      updateClear();
      setError("");
      hideQr(); // QR is created only when Generate QR is pressed
    });

    amountEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); generate(); }
    });

    $("generateBtn").addEventListener("click", generate);
    $("clearBtn").addEventListener("click", resetForNext);
    $("anotherBtn").addEventListener("click", resetForNext);

    /*************************************************************************
     * DOWNLOAD & WHATSAPP SHARE
     *************************************************************************/
    function buildCardCanvas() {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const W = 600, H = 820;
          const canvas = document.createElement("canvas");
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext("2d");

          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = "#E23744";
          ctx.fillRect(0, 0, W, 110);
          ctx.fillStyle = "#FFFFFF";
          ctx.textAlign = "center";
          ctx.font = "800 38px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText(PAYEE_NAME, W / 2, 68);

          ctx.fillStyle = "#696969";
          ctx.font = "600 22px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText("Scan to pay", W / 2, 170);

          ctx.fillStyle = "#1C1C1C";
          ctx.font = "800 64px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText(formatINR(currentAmount), W / 2, 245);

          const qrSize = 440;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, (W - qrSize) / 2, 285, qrSize, qrSize);

          ctx.fillStyle = "#696969";
          ctx.font = "500 22px 'JetBrains Mono', monospace";
          ctx.fillText(UPI_ID, W / 2, 755);
          ctx.font = "500 18px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = "#9C9C9C";
          ctx.fillText("Pay with GPay, PhonePe, Paytm or any UPI app", W / 2, 790);

          resolve(canvas);
        };
        img.onerror = reject;
        img.src = currentQrUrl;
      });
    }

    $("downloadBtn").addEventListener("click", async () => {
      if (!currentQrUrl) return;
      try {
        const canvas = await buildCardCanvas();
        const a = document.createElement("a");
        a.download = `Promila-UPI-${currentAmount}.png`;
        a.href = canvas.toDataURL("image/png");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        showToast("Could not create the image");
      }
    });

    $("shareBtn").addEventListener("click", async () => {
      if (!currentQrUrl) return;
      const text = `Pay ${formatINR(currentAmount)} to ${PAYEE_NAME}\nUPI ID: ${UPI_ID}`;
      try {
        const canvas = await buildCardCanvas();
        const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
        const file = new File([blob], `Promila-UPI-${currentAmount}.png`, { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], text });
            return;
          } catch (e) {
            if (e && e.name === "AbortError") return;
          }
        }
      } catch (e) {}
      // Fallback (desktop or browsers without file sharing): open WhatsApp with text
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
      showToast("Tap Download QR and attach the image in WhatsApp");
    });

    hideQr();
  </script>
</body>
</html>
